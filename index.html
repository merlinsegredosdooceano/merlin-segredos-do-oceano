<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Merlin: Segredos do Oceano</title>

    <style>
        body {
            margin: 0;
            background: #031b2e;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #5eead4;
            margin-bottom: 5px;
        }

        p {
            color: #b9e8f5;
        }

        #oceano {
            width: 900px;
            max-width: 95%;
            height: 500px;

            margin: 20px auto;

            background: linear-gradient(
                #168aad,
                #075985,
                #023047
            );

            border: 4px solid #5eead4;

            position: relative;
            overflow: hidden;
        }

        #merlin {
            position: absolute;

            left: 100px;
            top: 200px;

            font-size: 55px;

            user-select: none;
        }

        #nome {
            position: absolute;

            left: 100px;
            top: 260px;

            color: white;
            font-weight: bold;
        }

        .areia {
            position: absolute;

            bottom: 0;

            width: 100%;
            height: 60px;

            background: #d6b56d;
        }
    </style>
</head>

<body>

    <h1>🐢 Merlin: Segredos do Oceano</h1>

    <p>
        Explore o oceano, descubra novas espécies
        e desvende seus segredos.
    </p>

    <div id="oceano">

        <div class="areia"></div>

        <div id="merlin">🐢</div>

        <div id="nome">Merlin</div>

    </div>

    <p>
        Nossa primeira aventura está começando...
    </p>

</body>

</html>
